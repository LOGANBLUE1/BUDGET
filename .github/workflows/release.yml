# Builds a signed release APK and publishes it as a GitHub release.
#
# Run it from Actions > Release > Run workflow. Before the first run, add these repository
# secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore (.jks), base64-encoded on one line
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password
#
# The version you enter must match versionName in app/build.gradle.kts, and
# release-notes/v<version>.md must exist; it becomes the release description.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1.0 (must match versionName)"
        required: true
        default: "1.1.0"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check version and release notes
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::versionName in app/build.gradle.kts is '$declared', but you asked to release '$VERSION'."
            exit 1
          fi
          if [ ! -f "release-notes/v$VERSION.md" ]; then
            echo "::error::release-notes/v$VERSION.md is missing."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Bump the version for a new release."
            exit 1
          fi

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Check the APK is signed
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was produced (only an unsigned one). Check the signing secrets."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "budget-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: budget-v${{ inputs.version }}
          path: budget-v${{ inputs.version }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Budget v${{ inputs.version }}
          body_path: release-notes/v${{ inputs.version }}.md
          files: budget-v${{ inputs.version }}.apk
          fail_on_unmatched_files: true

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
